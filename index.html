<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feuille de Pointage BTP - Multi-Accès</title>
    <!-- SDK Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #d97706;
            --primary-hover: #b45309;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --sub-card: #f1f5f9;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 12px; max-width: 850px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 12px; background: var(--card-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
        .header h1 { font-size: 1.2rem; color: var(--primary); margin-bottom: 2px; }
        .header p { font-size: 0.8rem; color: var(--text-muted); }

        .auth-bar { display: flex; gap: 8px; background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 12px; align-items: center; justify-content: space-between; }
        .role-btn { padding: 6px 12px; border: 1px solid var(--border); background: #fff; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .role-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .week-picker-container { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 12px; }
        .week-picker-container label { font-weight: 700; font-size: 0.85rem; color: var(--text-main); }
        .week-picker-container input[type="week"], select, input[type="text"] { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-weight: 600; font-size: 0.9rem; }

        .card { background: var(--card-bg); border-radius: 8px; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
        .card-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; text-transform: capitalize; border-bottom: 1px solid var(--border); padding-bottom: 4px; }

        .chantier-block { background: var(--sub-card); border-radius: 6px; padding: 8px; margin-bottom: 6px; border: 1px dashed #cbd5e1; }
        .chantier-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; display: flex; justify-content: space-between; }

        .row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
        .col { flex: 1; }
        
        label { display: block; font-size: 0.7rem; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
        input[type="time"], input[type="date"], input[type="text"], textarea { width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.85rem; background: #fff; }
        textarea { resize: vertical; min-height: 35px; }

        .break-notice { font-size: 0.7rem; color: var(--primary-hover); background: #fffbe0; padding: 4px 8px; border-radius: 4px; margin-bottom: 6px; }

        .summary-box { background: #1e293b; color: white; border-radius: 8px; padding: 12px; margin-top: 12px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.85rem; }
        .summary-total { font-size: 1rem; font-weight: 700; border-top: 1px solid #334155; padding-top: 6px; margin-top: 6px; color: #f59e0b; }

        .actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; text-align: center; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #64748b; color: white; }
        .btn-add-chantier { background: #e2e8f0; color: #334155; font-size: 0.75rem; padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-weight: 600; cursor: pointer; margin-bottom: 6px; }

        /* MODE LECTURE SEULE (EMPLOYEUR) */
        body.read-only input, 
        body.read-only textarea, 
        body.read-only select {
            pointer-events: none;
            background-color: #f1f5f9 !important;
            border-color: #e2e8f0 !important;
            color: #334155 !important;
        }
        body.read-only .btn-add-chantier,
        body.read-only .btn-remove,
        body.read-only .btn-save,
        body.read-only #btn-add-extra {
            display: none !important;
        }

        /* IMPRESSION COMPACTE EN 1 PAGE RECTO A4 */
        @media print {
            @page { size: A4 portrait; margin: 5mm; }
            html, body { background: white !important; padding: 0 !important; margin: 0 !important; max-width: 100% !important; font-size: 8pt !important; }
            .header, .date-row, .day-total-box, .actions, .btn-remove, .btn-secondary, .btn-add-chantier, .break-notice, .week-picker-container label, .auth-bar, #btn-add-extra { display: none !important; }
            .week-picker-container { border: none !important; padding: 0 !important; margin-bottom: 6px !important; justify-content: flex-start !important; }
            .week-picker-container input, .week-picker-container select { border: none !important; font-size: 11pt !important; font-weight: bold !important; padding: 0 !important; }
            #days-container { display: block !important; }
            .card { padding: 4px 6px !important; margin-bottom: 4px !important; border: 1px solid #64748b !important; border-radius: 4px !important; page-break-inside: avoid !important; break-inside: avoid !important; }
            .card-title { font-size: 8.5pt !important; margin-bottom: 2px !important; padding-bottom: 2px !important; }
            .chantier-block { padding: 3px 5px !important; margin-bottom: 2px !important; border: 1px solid #cbd5e1 !important; background: #fff !important; }
            .chantier-title { font-size: 6.5pt !important; margin-bottom: 1px !important; }
            .row { margin-bottom: 2px !important; gap: 4px !important; }
            label { font-size: 6.5pt !important; margin-bottom: 0px !important; }
            input[type="time"], input[type="date"], input[type="text"], textarea { padding: 1px 3px !important; font-size: 7.5pt !important; border: 1px solid #cbd5e1 !important; border-radius: 2px !important; height: 18px !important; }
            textarea { min-height: 16px !important; height: 18px !important; }
            .summary-box { background: white !important; color: black !important; border: 1px solid #000 !important; padding: 6px !important; margin-top: 6px !important; page-break-inside: avoid !important; break-inside: avoid !important; border-radius: 4px !important; }
            .summary-row { font-size: 8pt !important; margin-bottom: 1px !important; }
            .summary-total { border-top: 1px solid #000 !important; color: black !important; padding-top: 2px !important; margin-top: 2px !important; font-size: 9pt !important; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Feuille de Pointage BTP</h1>
        <p>Gestion en temps réel • Salarié / Employeur</p>
    </div>

    <!-- Mode Accès -->
    <div class="auth-bar">
        <div>
            <button class="role-btn active" id="btn-role-salarie" onclick="setRole('salarie')">Accès Salarié</button>
            <button class="role-btn" id="btn-role-employeur" onclick="setRole('employeur')">Accès Employeur</button>
        </div>
        <div id="employee-select-box" style="display: none;">
            <select id="employee-list" onchange="loadEmployeeData()">
                <option value="">-- Choisir un salarié --</option>
            </select>
        </div>
    </div>

    <div class="week-picker-container">
        <div id="employee-name-input-box">
            <label for="employee-name">Salarié :</label>
            <input type="text" id="employee-name" placeholder="Nom Prénom" oninput="calculateAll()">
        </div>
        <label for="week-select">Semaine :</label>
        <input type="week" id="week-select" onchange="loadSelectedWeek()">
    </div>

    <div id="days-container"></div>

    <button class="btn btn-secondary" id="btn-add-extra" style="width:100%; margin-bottom:8px;" onclick="addExtraDay()">+ Ajouter un jour (Samedi / Dimanche)</button>

    <div class="summary-box">
        <div class="summary-row summary-total" id="row-total"><span>Total heures travaillées :</span><span id="stat-total-h">0h00</span></div>
        <div class="summary-row" id="row-normales"><span>Heures normales (base 8h/j) :</span><span id="stat-normales">0h00</span></div>
        <div class="summary-row" id="row-25"><span>Heures sup (+25%) :</span><span id="stat-25">0h00</span></div>
        <div class="summary-row" id="row-50"><span>Heures sup (+50%) :</span><span id="stat-50">0h00</span></div>
        <div class="summary-row" id="row-100"><span>Heures de nuit / Dimanche (+100%) :</span><span id="stat-100">0h00</span></div>
        <div class="summary-row" id="row-repos"><span>Repos Compensateur acquis :</span><span id="stat-repos">0h00</span></div>
    </div>

    <div class="actions">
        <button class="btn btn-primary btn-save" onclick="saveToCloud()">Synchroniser / Envoyer</button>
        <button class="btn btn-secondary" onclick="window.print()">Imprimer / PDF</button>
    </div>

    <script>
        // CLEFS DE CONFIGURATION FIREBASE
        const firebaseConfig = {
            apiKey: "AiZaSyDcAZ8_e1-y", 
            authDomain: "pointage-2e0ad.firebaseapp.com",
            databaseURL: "https://pointage-2e0ad-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "pointage-2e0ad",
            storageBucket: "pointage-2e0ad.appspot.com",
            messagingSenderId: "886685092873",
            appId: "1:886685092873:web:09d7a85c8a9b897652bcd8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let dayCount = 0;
        let currentRole = 'salarie';

        function setRole(role) {
            currentRole = role;
            document.getElementById('btn-role-salarie').classList.toggle('active', role === 'salarie');
            document.getElementById('btn-role-employeur').classList.toggle('active', role === 'employeur');
            
            if (role === 'employeur') {
                document.body.classList.add('read-only');
                document.getElementById('employee-select-box').style.display = 'block';
                document.getElementById('employee-name-input-box').style.display = 'none';
                fetchEmployeeList();
            } else {
                document.body.classList.remove('read-only');
                document.getElementById('employee-select-box').style.display = 'none';
                document.getElementById('employee-name-input-box').style.display = 'block';
            }
        }

        function getDayName(dateString) {
            if (!dateString) return "Journée";
            const parts = dateString.split('-');
            const date = new Date(parts[0], parts[1] - 1, parts[2]);
            return date.toLocaleDateString('fr-FR', { weekday: 'long' });
        }

        function updateDayTitle(dayId) {
            const card = document.getElementById(`day-${dayId}`);
            if (!card) return;
            const dateVal = card.querySelector('.date-picker').value;
            const dayName = getDayName(dateVal);
            card.querySelector('.day-name').innerText = dayName;
            calculateAll();
        }

        function getMondayOfWeekISO(year, week) {
            const simple = new Date(year, 0, 1 + (week - 1) * 7);
            const dow = simple.getDay();
            let daysToMonday = (dow === 0) ? 1 : (dow <= 4 ? 1 - dow : 8 - dow);
            const ISOWeekStart = new Date(simple);
            ISOWeekStart.setDate(simple.getDate() + daysToMonday);
            return ISOWeekStart;
        }

        function getWeekNumberISO(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        function setCurrentWeekPicker() {
            const today = new Date();
            const year = today.getFullYear();
            const week = getWeekNumberISO(today);
            const formattedWeek = `${year}-W${week < 10 ? '0' + week : week}`;
            document.getElementById('week-select').value = formattedWeek;
            loadSelectedWeek();
        }

        function loadSelectedWeek() {
            const weekVal = document.getElementById('week-select').value;
            if (!weekVal) return;

            const [year, week] = weekVal.split('-W').map(Number);
            const monday = getMondayOfWeekISO(year, week);

            document.getElementById('days-container').innerHTML = '';
            dayCount = 0;

            for (let i = 0; i < 5; i++) {
                const currentDay = new Date(monday);
                currentDay.setDate(monday.getDate() + i);
                const yyyy = currentDay.getFullYear();
                const mm = String(currentDay.getMonth() + 1).padStart(2, '0');
                const dd = String(currentDay.getDate()).padStart(2, '0');
                addDayWithDate(`${yyyy}-${mm}-${dd}`, true);
            }
            if (currentRole === 'employeur') fetchEmployeeList();
        }

        function addDayWithDate(dateStr, isDefaultWeek = false) {
            dayCount++;
            const container = document.getElementById('days-container');
            const dayName = getDayName(dateStr);
            
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `day-${dayCount}`;
            card.innerHTML = `
                <div class="card-title">
                    <span class="day-name">${dayName}</span>
                    ${!isDefaultWeek ? `<button class="btn-remove" style="background:none; border:none; color:var(--danger); cursor:pointer; font-weight:bold;" onclick="removeDay(${dayCount})">Supprimer</button>` : ''}
                </div>
                <div class="row date-row">
                    <div class="col">
                        <label>Date du jour</label>
                        <input type="date" class="date-picker" value="${dateStr}" onchange="updateDayTitle(${dayCount})">
                    </div>
                </div>
                <div class="chantiers-list" id="chantiers-day-${dayCount}"></div>
                <button class="btn-add-chantier" onclick="addChantier(${dayCount})">+ Ajouter un chantier</button>
                <div class="break-notice">ℹ️ Pause 12h00 - 13h00 déduite</div>
                <div class="row day-total-box">
                    <span style="font-size:0.8rem; font-weight:600;">Total jour : <strong class="day-total" style="color:var(--primary)">0h00</strong></span>
                </div>
            `;
            container.appendChild(card);
            addChantier(dayCount, "08:00", "17:00");
        }

        function addExtraDay() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            addDayWithDate(`${yyyy}-${mm}-${dd}`, false);
        }

        function addChantier(dayId, defaultStart = "08:00", defaultEnd = "17:00") {
            const chantiersContainer = document.getElementById(`chantiers-day-${dayId}`);
            if (!chantiersContainer) return;

            const chantierId = Date.now() + Math.random().toString(36).substr(2, 4);
            const chantierBlock = document.createElement('div');
            chantierBlock.className = 'chantier-block';
            chantierBlock.id = `chantier-${chantierId}`;
            chantierBlock.innerHTML = `
                <div class="chantier-title">
                    <span>Chantier / Intervention</span>
                    <button class="btn-remove" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:0.7rem;" onclick="removeChantier('${chantierId}')">Supprimer</button>
                </div>
                <div class="row">
                    <div class="col"><label>Chantier / Code</label><input type="text" class="input-chantier-nom" placeholder="Ex: Pins..." oninput="calculateAll()" /></div>
                    <div class="col"><label>Lieu / Ville</label><input type="text" class="input-chantier-lieu" placeholder="Ex: Lyon..." oninput="calculateAll()" /></div>
                </div>
                <div class="row">
                    <div class="col"><label>Arrivée</label><input type="time" class="time-in" value="${defaultStart}" onchange="calculateAll()"></div>
                    <div class="col"><label>Départ</label><input type="time" class="time-out" value="${defaultEnd}" onchange="calculateAll()"></div>
                </div>
                <div class="row">
                    <div class="col"><label>Travaux réalisés</label><textarea class="input-chantier-desc" placeholder="Ex: Maçonnerie..." oninput="calculateAll()"></textarea></div>
                </div>
            `;
            chantiersContainer.appendChild(chantierBlock);
            calculateAll();
        }

        function removeChantier(chantierId) {
            const block = document.getElementById(`chantier-${chantierId}`);
            if (block) block.remove();
            calculateAll();
        }

        function removeDay(id) {
            const card = document.getElementById(`day-${id}`);
            if (card) card.remove();
            calculateAll();
        }

        function parseTime(timeStr) {
            if (!timeStr) return 0;
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function calculateAll() {
            let totalMinutes = 0, normalMinutes = 0, h25Minutes = 0, h50Minutes = 0, h100Minutes = 0;
            const cards = document.querySelectorAll('.card');

            cards.forEach(card => {
                let dayWorkedMinutes = 0;
                const chantiers = card.querySelectorAll('.chantier-block');

                chantiers.forEach(chantier => {
                    const start = parseTime(chantier.querySelector('.time-in').value);
                    const end = parseTime(chantier.querySelector('.time-out').value);

                    if (end > start) {
                        let worked = end - start;
                        const overlapStart = Math.max(start, 720); // 12h00
                        const overlapEnd = Math.min(end, 780);   // 13h00

                        if (overlapEnd > overlapStart) worked -= (overlapEnd - overlapStart);
                        worked = Math.max(0, worked);
                        dayWorkedMinutes += worked;
                    }
                });

                let dayNormal = Math.min(dayWorkedMinutes, 480);
                let daySup = Math.max(0, dayWorkedMinutes - 480);

                totalMinutes += dayWorkedMinutes;
                normalMinutes += dayNormal;
                h25Minutes += Math.min(daySup, 120);
                h50Minutes += Math.max(0, daySup - 120);

                const hours = Math.floor(dayWorkedMinutes / 60);
                const mins = dayWorkedMinutes % 60;
                card.querySelector('.day-total').innerText = `${hours}h${mins < 10 ? '0' : ''}${mins}`;
            });

            let totalSupMinutes = h25Minutes + h50Minutes;
            let reposMinutes = Math.round(totalSupMinutes * 0.5);

            document.getElementById('stat-total-h').innerText = formatMinutes(totalMinutes);
            document.getElementById('stat-normales').innerText = formatMinutes(normalMinutes);
            document.getElementById('stat-25').innerText = formatMinutes(h25Minutes);
            document.getElementById('stat-50').innerText = formatMinutes(h50Minutes);
            document.getElementById('stat-100').innerText = formatMinutes(h100Minutes);
            document.getElementById('stat-repos').innerText = formatMinutes(reposMinutes);

            toggleRow('row-normales', normalMinutes > 0 && totalSupMinutes > 0);
            toggleRow('row-25', h25Minutes > 0);
            toggleRow('row-50', h50Minutes > 0);
            toggleRow('row-100', h100Minutes > 0);
            toggleRow('row-repos', reposMinutes > 0);
        }

        function toggleRow(elementId, condition) {
            const el = document.getElementById(elementId);
            if (el) el.style.display = condition ? 'flex' : 'none';
        }

        function formatMinutes(mins) {
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            return `${h}h${m < 10 ? '0' : ''}${m}`;
        }

        // FIREBASE : SAUVEGARDE & TEMPS RÉEL
        function saveToCloud() {
            const name = document.getElementById('employee-name').value.trim();
            const week = document.getElementById('week-select').value;
            if (!name) return alert("Veuillez remplir le nom du salarié.");

            const cards = document.querySelectorAll('.card');
            const dataDays = [];

            cards.forEach(card => {
                const dateVal = card.querySelector('.date-picker').value;
                const chantiers = [];
                card.querySelectorAll('.chantier-block').forEach(c => {
                    chantiers.push({
                        nom: c.querySelector('.input-chantier-nom').value,
                        lieu: c.querySelector('.input-chantier-lieu').value,
                        timeIn: c.querySelector('.time-in').value,
                        timeOut: c.querySelector('.time-out').value,
                        desc: c.querySelector('.input-chantier-desc').value
                    });
                });
                dataDays.push({ date: dateVal, chantiers: chantiers });
            });

            const key = `${week}_${name.replace(/\s+/g, '_')}`;
            db.ref('pointages/' + key).set({
                employeeName: name,
                week: week,
                days: dataDays
            }).then(() => alert("Feuille de pointage synchronisée avec succès !"));
        }

        function fetchEmployeeList() {
            const week = document.getElementById('week-select').value;
            const select = document.getElementById('employee-list');
            select.innerHTML = '<option value="">-- Choisir un salarié --</option>';

            db.ref('pointages').off(); // Clean listeners
            db.ref('pointages').on('value', (snapshot) => {
                select.innerHTML = '<option value="">-- Choisir un salarié --</option>';
                snapshot.forEach((child) => {
                    const item = child.val();
                    if (item.week === week) {
                        const opt = document.createElement('option');
                        opt.value = child.key;
                        opt.innerText = item.employeeName;
                        select.appendChild(opt);
                    }
                });
            });
        }

        function loadEmployeeData() {
            const key = document.getElementById('employee-list').value;
            if (!key) return;

            db.ref('pointages/' + key).on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                document.getElementById('days-container').innerHTML = '';
                dayCount = 0;

                data.days.forEach((d, idx) => {
                    addDayWithDate(d.date, idx < 5);
                    const chContainer = document.getElementById(`chantiers-day-${dayCount}`);
                    chContainer.innerHTML = ''; // Réinitialise les chantiers par défaut

                    d.chantiers.forEach(c => {
                        addChantier(dayCount, c.timeIn, c.timeOut);
                        const lastChantier = chContainer.lastElementChild;
                        lastChantier.querySelector('.input-chantier-nom').value = c.nom;
                        lastChantier.querySelector('.input-chantier-lieu').value = c.lieu;
                        lastChantier.querySelector('.input-chantier-desc').value = c.desc;
                    });
                });
                calculateAll();
            });
        }

        setCurrentWeekPicker();
    </script>
</body>
</html>
