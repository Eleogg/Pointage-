<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feuille de Pointage BTP</title>
    <style>
        :root {
            --primary: #d97706;
            --primary-hover: #b45309;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #dc2626;
            --success: #16a34a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 12px; max-width: 800px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 16px; background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border); }
        .header h1 { font-size: 1.3rem; color: var(--primary); margin-bottom: 4px; }
        .header p { font-size: 0.85rem; color: var(--text-muted); }

        .profile-selector { display: flex; gap: 8px; margin-bottom: 16px; }
        .btn-profile { flex: 1; padding: 10px; border: 2px solid var(--border); background: var(--card-bg); border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-profile.active { border-color: var(--primary); background: #fffbe0; color: var(--primary-hover); }

        .card { background: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); }
        .card-title { font-weight: 700; font-size: 1rem; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

        .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .col { flex: 1; }
        
        label { display: block; font-size: 0.75rem; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
        input[type="time"], input[type="date"], textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
        textarea { resize: vertical; min-height: 40px; }

        .break-notice { font-size: 0.75rem; color: var(--primary-hover); background: #fffbe0; padding: 6px 10px; border-radius: 6px; margin-bottom: 8px; }

        .summary-box { background: #1e293b; color: white; border-radius: 12px; padding: 16px; margin-top: 16px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem; }
        .summary-total { font-size: 1.1rem; font-weight: 700; border-top: 1px solid #334155; pt: 8px; margin-top: 8px; color: #f59e0b; }

        .actions { display: flex; gap: 8px; margin-top: 16px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #64748b; color: white; }

        @media print {
            .profile-selector, .actions, .btn-remove { display: none !important; }
            body { background: white; padding: 0; }
            .card, .header, .summary-box { border: 1px solid #ccc; box-shadow: none; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Feuille de Pointage BTP</h1>
        <p>Base 8h/jour • Pause 12h-13h déduite • Majorations & Repos</p>
    </div>

    <div class="profile-selector">
        <button class="btn-profile active" id="btn-salarie" onclick="setProfile('salarie')">Profil Salarié</button>
        <button class="btn-profile" id="btn-employeur" onclick="setProfile('employeur')">Profil Employeur</button>
    </div>

    <div id="days-container"></div>

    <button class="btn btn-secondary" style="width:100%; margin-bottom:12px;" onclick="addDay()">+ Ajouter une journée</button>

    <div class="summary-box">
        <div class="summary-row"><span>Total heures travaillées :</span><span id="stat-total-h">0h00</span></div>
        <div class="summary-row"><span>Heures normales (base 8h/j) :</span><span id="stat-normales">0h00</span></div>
        <div class="summary-row"><span>Heures sup (+25%) :</span><span id="stat-25">0h00</span></div>
        <div class="summary-row"><span>Heures sup (+50%) :</span><span id="stat-50">0h00</span></div>
        <div class="summary-row"><span>Heures de nuit / Dimanche (+100%) :</span><span id="stat-100">0h00</span></div>
        <div class="summary-row summary-total"><span>Repos Compensateur acquis :</span><span id="stat-repos">0h00</span></div>
    </div>

    <div class="actions">
        <div class="btn btn-primary" onclick="window.print()">Imprimer / Exporter PDF</div>
    </div>

    <script>
        let currentProfile = 'salarie';
        let dayCount = 0;

        function setProfile(profile) {
            currentProfile = profile;
            document.getElementById('btn-salarie').classList.toggle('active', profile === 'salarie');
            document.getElementById('btn-employeur').classList.toggle('active', profile === 'employeur');
        }

        function addDay() {
            dayCount++;
            const container = document.getElementById('days-container');
            const today = new Date().toISOString().split('T')[0];
            
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `day-${dayCount}`;
            card.innerHTML = `
                <div class="card-title">
                    <span>Journée ${dayCount}</span>
                    <button class="btn-remove" style="background:none; border:none; color:var(--danger); cursor:pointer; font-weight:bold;" onclick="removeDay(${dayCount})">Supprimer</button>
                </div>
                <div class="row">
                    <div class="col">
                        <label>Date</label>
                        <input type="date" value="${today}" onchange="calculateAll()">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>Heure d'arrivée</label>
                        <input type="time" class="time-in" value="08:00" onchange="calculateAll()">
                    </div>
                    <div class="col">
                        <label>Heure de départ</label>
                        <input type="time" class="time-out" value="17:00" onchange="calculateAll()">
                    </div>
                </div>
                <div class="break-notice">
                    ℹ️ Pause repas automatique déduite : 12h00 - 13h00 (non payée)
                </div>
                <div class="row">
                    <div class="col">
                        <label>Description des travaux / Chantier</label>
                        <textarea placeholder="Ex: Pose de plaques, maçonnerie, chantier Lyon..."></textarea>
                    </div>
                </div>
                <div class="row" style="margin-top: 4px;">
                    <span style="font-size:0.85rem; font-weight:600;">Heures payées : <strong class="day-total" style="color:var(--primary)">8h00</strong></span>
                </div>
            `;
            container.appendChild(card);
            calculateAll();
        }

        function removeDay(id) {
            const card = document.getElementById(`day-${id}`);
            if (card) card.remove();
            calculateAll();
        }

        function parseTime(timeStr) {
            if (!timeStr) return 0;
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function calculateAll() {
            let totalMinutes = 0;
            let normalMinutes = 0;
            let h25Minutes = 0;
            let h50Minutes = 0;
            let h100Minutes = 0;

            const cards = document.querySelectorAll('.card');

            cards.forEach(card => {
                const start = parseTime(card.querySelector('.time-in').value);
                const end = parseTime(card.querySelector('.time-out').value);

                if (end > start) {
                    let worked = end - start;

                    // Exclusion automatique de la pause 12h00 - 13h00 (720 min à 780 min)
                    const breakStart = 12 * 60; // 720
                    const breakEnd = 13 * 60;   // 780

                    const overlapStart = Math.max(start, breakStart);
                    const overlapEnd = Math.min(end, breakEnd);

                    if (overlapEnd > overlapStart) {
                        worked -= (overlapEnd - overlapStart);
                    }

                    worked = Math.max(0, worked);

                    // Calcul journée (base 8h = 480 min)
                    let dayNormal = Math.min(worked, 480);
                    let daySup = Math.max(0, worked - 480);

                    // Ventilation heures sup journalières
                    let day25 = Math.min(daySup, 120); // 2 premières heures sup (+25%)
                    let day50 = Math.max(0, daySup - 120); // au-delà (+50%)

                    totalMinutes += worked;
                    normalMinutes += dayNormal;
                    h25Minutes += day25;
                    h50Minutes += day50;

                    const hours = Math.floor(worked / 60);
                    const mins = worked % 60;
                    card.querySelector('.day-total').innerText = `${hours}h${mins < 10 ? '0' : ''}${mins}`;
                }
            });

            // Calcul du Repos Compensateur (50% des heures sup au-delà de la base)
            let totalSupMinutes = h25Minutes + h50Minutes;
            let reposMinutes = Math.round(totalSupMinutes * 0.5);

            // Mise à jour de l'affichage
            document.getElementById('stat-total-h').innerText = formatMinutes(totalMinutes);
            document.getElementById('stat-normales').innerText = formatMinutes(normalMinutes);
            document.getElementById('stat-25').innerText = formatMinutes(h25Minutes);
            document.getElementById('stat-50').innerText = formatMinutes(h50Minutes);
            document.getElementById('stat-100').innerText = formatMinutes(h100Minutes);
            document.getElementById('stat-repos').innerText = formatMinutes(reposMinutes);
        }

        function formatMinutes(mins) {
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            return `${h}h${m < 10 ? '0' : ''}${m}`;
        }

        // Première journée par défaut
        addDay();
    </script>
</body>
</html>
