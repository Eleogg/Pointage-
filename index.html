<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feuille de Pointage BTP</title>
    <style>
        :root {
            --primary: #d97706;
            --primary-hover: #b45309;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --sub-card: #f1f5f9;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 12px; max-width: 850px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 12px; background: var(--card-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
        .header h1 { font-size: 1.2rem; color: var(--primary); margin-bottom: 2px; }
        .header p { font-size: 0.8rem; color: var(--text-muted); }

        .week-picker-container { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 12px; }
        .week-picker-container label { font-weight: 700; font-size: 0.85rem; color: var(--text-main); margin-bottom: 0; }
        .week-picker-container input[type="week"] { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-weight: 600; font-size: 0.9rem; }

        .card { background: var(--card-bg); border-radius: 8px; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
        .card-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; text-transform: capitalize; border-bottom: 1px solid var(--border); padding-bottom: 4px; }

        .chantier-block { background: var(--sub-card); border-radius: 6px; padding: 8px; margin-bottom: 6px; border: 1px dashed #cbd5e1; }
        .chantier-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; display: flex; justify-content: space-between; }

        .row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
        .col { flex: 1; }
        
        label { display: block; font-size: 0.7rem; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
        input[type="time"], input[type="date"], input[type="text"], textarea { width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.85rem; background: #fff; }
        textarea { resize: vertical; min-height: 35px; }

        .break-notice { font-size: 0.7rem; color: var(--primary-hover); background: #fffbe0; padding: 4px 8px; border-radius: 4px; margin-bottom: 6px; }

        .summary-box { background: #1e293b; color: white; border-radius: 8px; padding: 12px; margin-top: 12px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.85rem; }
        .summary-total { font-size: 1rem; font-weight: 700; border-top: 1px solid #334155; padding-top: 6px; margin-top: 6px; color: #f59e0b; }

        .actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; text-align: center; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #64748b; color: white; }
        .btn-add-chantier { background: #e2e8f0; color: #334155; font-size: 0.75rem; padding: 4px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-weight: 600; cursor: pointer; margin-bottom: 6px; }

        /* IMPRESSION EN 1 SEULE FEUILLE A4 */
        @media print {
            @page { size: A4 portrait; margin: 8mm; }
            body { background: white; padding: 0; max-width: 100%; font-size: 10pt; }
            .actions, .btn-remove, .btn-secondary, .btn-add-chantier, .week-picker-container label { display: none !important; }
            .week-picker-container { border: none; padding: 0; margin-bottom: 8px; justify-content: flex-start; }
            .week-picker-container input { border: none; font-size: 11pt; font-weight: bold; padding: 0; }
            .header { padding: 6px; margin-bottom: 8px; border: 1px solid #94a3b8; }
            .header h1 { font-size: 14pt; }
            .header p { font-size: 8pt; }
            .card { padding: 6px; margin-bottom: 6px; border: 1px solid #94a3b8; page-break-inside: avoid; }
            .card-title { font-size: 10pt; margin-bottom: 4px; padding-bottom: 2px; }
            .chantier-block { padding: 4px; margin-bottom: 4px; border: 1px solid #cbd5e1; }
            label { font-size: 7pt; margin-bottom: 1px; }
            input[type="time"], input[type="date"], input[type="text"], textarea { padding: 2px 4px; font-size: 8pt; border: 1px solid #cbd5e1; }
            textarea { min-height: 24px; }
            .break-notice { display: none; }
            .summary-box { background: white !important; color: black !important; border: 1px solid #000; padding: 8px; margin-top: 8px; page-break-inside: avoid; }
            .summary-row { font-size: 9pt; margin-bottom: 2px; }
            .summary-total { border-top: 1px solid #000; color: black !important; padding-top: 4px; margin-top: 4px; font-size: 10pt; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Feuille de Pointage BTP</h1>
        <p>Du Lundi au Vendredi • Déduction pause 12h-13h • Multi-chantiers</p>
    </div>

    <div class="week-picker-container">
        <label for="week-select">Choisir la semaine :</label>
        <input type="week" id="week-select" onchange="loadSelectedWeek()">
    </div>

    <div id="days-container"></div>

    <button class="btn btn-secondary" style="width:100%; margin-bottom:8px;" onclick="addExtraDay()">+ Ajouter un jour (Samedi / Dimanche)</button>

    <div class="summary-box">
        <div class="summary-row"><span>Total heures travaillées :</span><span id="stat-total-h">0h00</span></div>
        <div class="summary-row"><span>Heures normales (base 8h/j) :</span><span id="stat-normales">0h00</span></div>
        <div class="summary-row"><span>Heures sup (+25%) :</span><span id="stat-25">0h00</span></div>
        <div class="summary-row"><span>Heures sup (+50%) :</span><span id="stat-50">0h00</span></div>
        <div class="summary-row"><span>Heures de nuit / Dimanche (+100%) :</span><span id="stat-100">0h00</span></div>
        <div class="summary-row summary-total"><span>Repos Compensateur acquis :</span><span id="stat-repos">0h00</span></div>
    </div>

    <div class="actions">
        <div class="btn btn-primary" onclick="window.print()">Imprimer / Exporter PDF</div>
    </div>

    <script>
        let dayCount = 0;

        // Fonction pour formater une date ISO en nom de jour français
        function getDayName(dateString) {
            if (!dateString) return "Journée";
            // On sépare la date pour éviter les problèmes de fuseau horaire
            const parts = dateString.split('-');
            const date = new Date(parts[0], parts[1] - 1, parts[2]);
            return date.toLocaleDateString('fr-FR', { weekday: 'long' });
        }

        // Met à jour le titre de la carte (ex: Lundi) quand la date change
        function updateDayTitle(dayId) {
            const card = document.getElementById(`day-${dayId}`);
            if (!card) return;
            const dateVal = card.querySelector('.date-picker').value;
            const dayName = getDayName(dateVal);
            card.querySelector('.day-name').innerText = dayName;
            calculateAll();
        }

        // Calcul correct du Lundi d'une semaine ISO
        function getMondayOfWeekISO(year, week) {
            // Premier jour de l'année
            const simple = new Date(year, 0, 1 + (week - 1) * 7);
            const dow = simple.getDay(); // 0=Dimanche, 1=Lundi, ..., 6=Samedi
            
            // On calcule le décalage pour tomber sur le lundi
            let daysToMonday;
            if (dow === 0) { // C'est un dimanche
                daysToMonday = 1;
            } else if (dow <= 4) { // Lundi à Jeudi
                daysToMonday = 1 - dow;
            } else { // Vendredi ou Samedi
                daysToMonday = 8 - dow;
            }
            
            // Applique le décalage
            const ISOWeekStart = new Date(simple);
            ISOWeekStart.setDate(simple.getDate() + daysToMonday);
            
            return ISOWeekStart;
        }

        // Numéro de la semaine pour une date donnée
        function getWeekNumberISO(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        // Initialise le sélecteur de semaine sur la semaine en cours
        function setCurrentWeekPicker() {
            const today = new Date();
            const year = today.getFullYear();
            const week = getWeekNumberISO(today);
            const formattedWeek = `${year}-W${week < 10 ? '0' + week : week}`;
            document.getElementById('week-select').value = formattedWeek;
            loadSelectedWeek();
        }

        // Charge les 5 jours (Lundi-Vendredi) de la semaine sélectionnée
        function loadSelectedWeek() {
            const weekVal = document.getElementById('week-select').value;
            if (!weekVal) return;

            const [year, week] = weekVal.split('-W').map(Number);
            const monday = getMondayOfWeekISO(year, week);

            document.getElementById('days-container').innerHTML = '';
            dayCount = 0;

            // 5 jours : Lundi, Mardi, Mercredi, Jeudi, Vendredi
            for (let i = 0; i < 5; i++) {
                const currentDay = new Date(monday);
                currentDay.setDate(monday.getDate() + i);
                
                // Formatage manuel pour input date (yyyy-mm-dd)
                const yyyy = currentDay.getFullYear();
                const mm = String(currentDay.getMonth() + 1).padStart(2, '0');
                const dd = String(currentDay.getDate()).padStart(2, '0');
                const dateStr = `${yyyy}-${mm}-${dd}`;
                
                addDayWithDate(dateStr, true);
            }
        }

        // Ajoute un jour (carte) avec une date préremplie
        function addDayWithDate(dateStr, isDefaultWeek = false) {
            dayCount++;
            const container = document.getElementById('days-container');
            const dayName = getDayName(dateStr);
            
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `day-${dayCount}`;
            card.innerHTML = `
                <div class="card-title">
                    <span class="day-name">${dayName}</span>
                    ${!isDefaultWeek ? `<button class="btn-remove" style="background:none; border:none; color:var(--danger); cursor:pointer; font-weight:bold;" onclick="removeDay(${dayCount})">Supprimer le jour</button>` : ''}
                </div>
                <div class="row">
                    <div class="col">
                        <label>Date du jour</label>
                        <input type="date" class="date-picker" value="${dateStr}" onchange="updateDayTitle(${dayCount})">
                    </div>
                </div>

                <div class="chantiers-list" id="chantiers-day-${dayCount}"></div>

                <button class="btn-add-chantier" onclick="addChantier(${dayCount})">+ Ajouter un chantier à ce jour</button>

                <div class="break-notice">
                    ℹ️ Pause repas automatique déduite : 12h00 - 13h00 (non payée)
                </div>

                <div class="row" style="margin-top: 4px;">
                    <span style="font-size:0.8rem; font-weight:600;">Total heures payées du jour : <strong class="day-total" style="color:var(--primary)">0h00</strong></span>
                </div>
            `;
            container.appendChild(card);
            
            addChantier(dayCount, "08:00", "17:00");
        }

        // Ajoute un jour de week-end (samedi/dimanche)
        function addExtraDay() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const dateStr = `${yyyy}-${mm}-${dd}`;
            addDayWithDate(dateStr, false);
        }

        // Ajoute une ligne de chantier dans un jour
        function addChantier(dayId, defaultStart = "08:00", defaultEnd = "17:00") {
            const chantiersContainer = document.getElementById(`chantiers-day-${dayId}`);
            if (!chantiersContainer) return;

            const chantierId = Date.now() + Math.random().toString(36).substr(2, 4);

            const chantierBlock = document.createElement('div');
            chantierBlock.className = 'chantier-block';
            chantierBlock.id = `chantier-${chantierId}`;
            chantierBlock.innerHTML = `
                <div class="chantier-title">
                    <span>Chantier / Intervention</span>
                    <button class="btn-remove" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:0.7rem;" onclick="removeChantier('${chantierId}')">Supprimer</button>
                </div>
                <div class="row">
                    <div class="col">
                        <label>Nom du Chantier / Code</label>
                        <input type="text" placeholder="Ex: Résidence Les Pins..." />
                    </div>
                    <div class="col">
                        <label>Lieu / Ville</label>
                        <input type="text" placeholder="Ex: Lyon, Paris..." />
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>Heure d'arrivée</label>
                        <input type="time" class="time-in" value="${defaultStart}" onchange="calculateAll()">
                    </div>
                    <div class="col">
                        <label>Heure de départ</label>
                        <input type="time" class="time-out" value="${defaultEnd}" onchange="calculateAll()">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>Description des travaux</label>
                        <textarea placeholder="Ex: Pose de plaques, maçonnerie..."></textarea>
                    </div>
                </div>
            `;
            chantiersContainer.appendChild(chantierBlock);
            calculateAll();
        }

        // Supprime une ligne de chantier
        function removeChantier(chantierId) {
            const block = document.getElementById(`chantier-${chantierId}`);
            if (block) block.remove();
            calculateAll();
        }

        // Supprime une carte de jour
        function removeDay(id) {
            const card = document.getElementById(`day-${id}`);
            if (card) card.remove();
            calculateAll();
        }

        // Convertit HH:MM en minutes
        function parseTime(timeStr) {
            if (!timeStr) return 0;
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        // Recalcule tous les totaux
        function calculateAll() {
            let totalMinutes = 0;
            let normalMinutes = 0;
            let h25Minutes = 0;
            let h50Minutes = 0;
            let h100Minutes = 0;

            const cards = document.querySelectorAll('.card');

            cards.forEach(card => {
                let dayWorkedMinutes = 0;
                const chantiers = card.querySelectorAll('.chantier-block');

                chantiers.forEach(chantier => {
                    const start = parseTime(chantier.querySelector('.time-in').value);
                    const end = parseTime(chantier.querySelector('.time-out').value);

                    if (end > start) {
                        let worked = end - start;

                        // Pause repas 12h00 - 13h00 (720 min à 780 min)
                        const breakStart = 720; // 12h00
                        const breakEnd = 780;   // 13h00

                        const overlapStart = Math.max(start, breakStart);
                        const overlapEnd = Math.min(end, breakEnd);

                        if (overlapEnd > overlapStart) {
                            worked -= (overlapEnd - overlapStart);
                        }

                        worked = Math.max(0, worked);
                        dayWorkedMinutes += worked;
                    }
                });

                // Ventilation par journée (Base 8h = 480 min)
                let dayNormal = Math.min(dayWorkedMinutes, 480);
                let daySup = Math.max(0, dayWorkedMinutes - 480);

                let day25 = Math.min(daySup, 120);
                let day50 = Math.max(0, daySup - 120);

                totalMinutes += dayWorkedMinutes;
                normalMinutes += dayNormal;
                h25Minutes += day25;
                h50Minutes += day50;

                const hours = Math.floor(dayWorkedMinutes / 60);
                const mins = dayWorkedMinutes % 60;
                card.querySelector('.day-total').innerText = `${hours}h${mins < 10 ? '0' : ''}${mins}`;
            });

            // Calcul du Repos Compensateur (50% des heures sup au-delà de la base)
            let totalSupMinutes = h25Minutes + h50Minutes;
            let reposMinutes = Math.round(totalSupMinutes * 0.5);

            // Mise à jour de l'affichage
            document.getElementById('stat-total-h').innerText = formatMinutes(totalMinutes);
            document.getElementById('stat-normales').innerText = formatMinutes(normalMinutes);
            document.getElementById('stat-25').innerText = formatMinutes(h25Minutes);
            document.getElementById('stat-50').innerText = formatMinutes(h50Minutes);
            document.getElementById('stat-100').innerText = formatMinutes(h100Minutes);
            document.getElementById('stat-repos').innerText = formatMinutes(reposMinutes);
        }

        // Convertit minutes en HHhMM
        function formatMinutes(mins) {
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            return `${h}h${m < 10 ? '0' : ''}${m}`;
        }

        // Initialisation automatique
        setCurrentWeekPicker();
    </script>
</body>
</html>
